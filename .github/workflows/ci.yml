name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, compile and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest interpreter shipped with a supported QGIS LTR;
        # 3.12 is what current QGIS builds use.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development tools
        run: python -m pip install --upgrade pip ruff pytest
      # PyQt6 is not a dependency of the plugin: it only serves the test that
      # builds the window under Qt6, which is what QGIS 4 uses. If no wheel
      # exists for this interpreter the step is allowed to fail and the test
      # skips itself -- a missing wheel should not fail the build, but it does
      # mean QGIS 4 compatibility went unverified on that interpreter.
      - name: Install PyQt6 for the QGIS 4 compatibility test
        continue-on-error: true
        run: python -m pip install PyQt6

      - name: Lint
        run: ruff check .

      - name: Byte-compile the plugin
        run: python -m compileall -q processing ui topotrail.py __init__.py topotrail_config.py

      - name: Test
        run: pytest

  metadata:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip cffconvert
      - run: cffconvert --validate
