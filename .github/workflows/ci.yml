name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and unit tests (Python ${{ matrix.python-version }}${{ !matrix.scipy && ', no SciPy' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest interpreter shipped with a supported QGIS LTR;
        # 3.12 is what current QGIS builds use. The no-SciPy run is the plugin
        # as it loads on a Debian/Ubuntu QGIS without python3-scipy.
        python-version: ["3.9", "3.12"]
        scipy: [true]
        include:
          - python-version: "3.12"
            scipy: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development tools
        # pyproj only serves the test stubs that stand in for GDAL's OSR.
        run: |
          python -m pip install --upgrade pip ruff pytest bandit flake8 numpy pyproj
          if [ "${{ matrix.scipy }}" = "true" ]; then python -m pip install scipy; fi

      # PyQt6 is not a dependency of the plugin: it only serves the test that
      # builds the window under Qt6, which is what QGIS 4 uses. If no wheel
      # exists for this interpreter the test skips itself.
      - name: Install PyQt6 for the QGIS 4 compatibility test
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
          python -m pip install PyQt6

      - name: Lint
        run: ruff check .

      # The same two scanners plugins.qgis.org runs on upload. Bandit findings
      # of any severity block the version there, so they block here first.
      - name: Security scan (as plugins.qgis.org does)
        run: |
          bandit -q -r processing ui topotrail.py __init__.py topotrail_config.py
          flake8 --max-line-length=160 --extend-ignore=E203,W503 processing ui topotrail.py __init__.py topotrail_config.py

      - name: Byte-compile the plugin
        run: python -m compileall -q processing ui topotrail.py __init__.py topotrail_config.py

      - name: Test
        run: pytest -rs

  qgis:
    # The plugin inside real QGIS: the Processing algorithm end to end, the
    # four-step window driven as a user drives it, the reproducible example,
    # and the zip installed and loaded through qgis.utils like the Plugin
    # Manager does. From the oldest declared version to the current release.
    name: Real QGIS ${{ matrix.qgis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis: ["final-3_22_16", "ltr", "stable"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Tools inside the image
        # Old images carry third-party apt sources that no longer exist
        # (nodesource); drop them so apt-get update does not abort.
        run: |
          rm -f /etc/apt/sources.list.d/*nodesource*
          apt-get update -q
          apt-get install -y -q git python3-pip
          python3 -m pip install pytest \
            || python3 -m pip install --break-system-packages pytest

      - uses: actions/checkout@v4

      - name: Versions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -c "import sys, numpy; from qgis.core import Qgis; from osgeo import gdal; print('QGIS', Qgis.version(), '| Python', sys.version.split()[0], '| GDAL', gdal.__version__, '| NumPy', numpy.__version__)"
          python3 -c "import scipy; print('SciPy', scipy.__version__)" || echo "SciPy: absent (NumPy fallback in use)"

      - name: Unit and integration tests
        run: python3 -m pytest -rs

      - name: Reproducible example
        run: python3 exemplo/executar.py

      - name: Packaged zip installs and loads like the Plugin Manager does
        run: |
          python3 tools/empacotar.py --saida dist
          python3 tools/instalar_e_carregar.py dist/TopoTrail-*.zip

  metadata:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip cffconvert
      - run: cffconvert --validate
